name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Node only: every package's tests, the repository tests, and sync --check.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Link the workspaces (no third-party dependencies)
        run: npm ci --no-audit --no-fund
      - name: npm test
        run: npm test

  # The marketplace route (.claude-plugin/ at the root, plugins under bundle/):
  # run Claude Code's own validator on it. Pinned so a validator change shows up
  # as a reviewed bump, not a red main.
  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: claude plugin validate .
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          DISABLE_TELEMETRY: "1"
          DISABLE_AUTOUPDATER: "1"
        run: npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate .

  # Optional: packages/cela/nemo is the cela-nat pip package for NVIDIA NeMo
  # Agent Toolkit, Python by nature. Every leg drives the real engine, so each
  # needs Node too. Kept out of the Node pipeline above.
  nemo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wrapper only
            python: "3.11"
            install: python -m pip install pytest pytest-asyncio
            pythonpath: packages/cela/nemo/src
          - name: NeMo Agent Toolkit
            python: "3.12"
            install: python -m pip install "./packages/cela/nemo[agents,test]"
            pythonpath: ""
          - name: NeMo Agent Toolkit 1.8
            python: "3.12"
            install: python -m pip install "./packages/cela/nemo[agents,test]" "nvidia-nat-core==1.8.*" "nvidia-nat-langchain[openai,nvidia]==1.8.*"
            pythonpath: ""
    name: nemo (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: ${{ matrix.install }}
      - name: pytest
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: python -m pytest -v -rs -c packages/cela/nemo/pyproject.toml packages/cela/nemo/tests
