<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ceciCela graph player</title>
<!-- JetBrains Mono, hosted by Cloudflare (cdnjs, fontsource-jetbrains-mono 5.3.0). Optional: where a host blocks it, the system monospace below takes over and the screen is unchanged. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontsource-jetbrains-mono/5.3.0/400.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontsource-jetbrains-mono/5.3.0/700.min.css">
<style>
  :root { --fg: #33ff66; --dim: #1c8c3a; --bg: #041006; --glow: rgba(51, 255, 102, .35); }
  :root[data-theme="amber"] { --fg: #ffb000; --dim: #9a6a00; --bg: #120b00; --glow: rgba(255, 176, 0, .35); }
  :root[data-theme="ansi"] { --fg: #c0c0c0; --dim: #5a5a5a; --bg: #000; --glow: rgba(85, 255, 255, .25); }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { display: flex; justify-content: center; padding: 12px 0; font: clamp(7px, min(1.95vw, 3.4vh), 34px)/1.2 "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  .crt { position: relative; max-width: 100%; overflow-x: auto; }
  .crt::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  pre { margin: 0; padding: 8px 10px; font: inherit; white-space: pre; text-shadow: 0 0 4px var(--glow); }
  /* phosphor and amber: one colour, weight, dim, inverse, blink. */
  .a-i, .a-n, .a-w, .a-1, .a-2, .a-3, .a-4, .a-5, .a-6 { background: var(--fg); color: var(--bg); text-shadow: none; }
  .a-b, .a-p, .a-g, .a-y, .a-s, .a-h { font-weight: 700; }
  .a-d, .a-m { color: var(--dim); }
  .a-k { font-weight: 700; animation: blink 1s steps(1) infinite; }
  .a-h { cursor: pointer; }
  .a-h:hover { background: var(--fg); color: var(--bg); }
  /* ansi: the 16-colour BBS palette. */
  [data-theme="ansi"] .a-i { background: #0000aa; color: #fff; font-weight: 700; }
  [data-theme="ansi"] .a-b { color: #fff; }
  [data-theme="ansi"] .a-d { color: #555; }
  [data-theme="ansi"] .a-k { color: #ff5555; }
  [data-theme="ansi"] .a-p { color: #ffff55; }
  [data-theme="ansi"] .a-g { color: #55ff55; }
  [data-theme="ansi"] .a-y { color: #ffff55; }
  [data-theme="ansi"] .a-c { color: #00aaaa; }
  [data-theme="ansi"] .a-m { color: #aa00aa; }
  [data-theme="ansi"] .a-n { background: #00aaaa; color: #000; }
  [data-theme="ansi"] .a-s { color: #55ffff; }
  [data-theme="ansi"] .a-w { background: #00aa00; color: #fff; }
  [data-theme="ansi"] .a-h { background: #0000aa; color: #ffff55; }
  [data-theme="ansi"] .a-h:hover { background: #ffff55; color: #0000aa; }
  [data-theme="ansi"] .a-f { background: #0000aa; color: #aaa; }
  [data-theme="ansi"] .a-1 { background: #0000aa; color: #ff5555; }
  [data-theme="ansi"] .a-2 { background: #0000aa; color: #ffff55; }
  [data-theme="ansi"] .a-3 { background: #0000aa; color: #55ff55; }
  [data-theme="ansi"] .a-4 { background: #0000aa; color: #55ffff; }
  [data-theme="ansi"] .a-5 { background: #0000aa; color: #ff55ff; }
  [data-theme="ansi"] .a-6 { background: #0000aa; color: #fff; }
  [data-theme="ansi"] pre { text-shadow: none; }
  @keyframes blink { 50% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { .a-k { animation: none; } }
</style>
</head>
<body>
<div class="crt"><pre id="screen" aria-live="off" tabindex="0" aria-label="ceciCela graph: click a [key] on the bottom row, or press it"></pre></div>
<script>
/*@@TUI@@*/
</script>
<script>
// The model edits only STATE and EVENTS. Append one line per state change above the marker; never re-send this file.
var STATE = /*@@STATE@@*/;
var EVENTS = [
/*@@EVENTS@@*/
  // append new event lines above this one
];

var T = window.CeciTUI;
var screenEl = document.getElementById('screen');
var base = T.fromStateMd(STATE);
base.events = EVENTS;
var keys = { graph: null, legend: false, paused: false, theme: base.budget === 'creator' ? 'ansi' : 'phosphor', speed: 250, replay: false };
var step = EVENTS.length;
var tick = 0;
var typed = 0;
var freshAt = 0;
var panel = null;
var clock = function () { return Date.now(); };
var reveal = base.graph === 'frames' ? 0 : undefined;

// Replay does not know the statuses before the first event, so it shows every
// job an event touched as not started; the title says "replay" the whole time.
function rewound(model) {
  var touched = {};
  model.events.forEach(function (line) {
    var ev = T.parseEvent(line);
    if (ev && ev.type === 'job') touched[ev.job] = true;
  });
  var copy = JSON.parse(JSON.stringify(model));
  copy.events = model.events;
  copy.jobs.forEach(function (job) {
    if (!touched[job.id]) return;
    job.status = job.depends_on.length ? 'blocked' : 'ready';
    job.cela = null;
  });
  return copy;
}

function screen() {
  var model = keys.replay ? rewound(base) : base;
  var view = Object.assign({}, model, { legend: keys.legend });
  if (keys.graph) view.graph = keys.graph;
  var opts = { tick: tick, step: keys.replay ? step : undefined, footer: 'player', fresh: tick - freshAt, glyphs: keys.theme === 'ansi' ? 'cp437' : 'ascii' };
  if (keys.replay) opts.replay = true;
  if (typed !== null) opts.typed = typed;
  if (reveal !== undefined) opts.reveal = reveal;
  if (clock) opts.now = clock();
  if (panel) opts.panel = panel;
  return T.render(view, opts);
}

function draw() {
  screenEl.innerHTML = T.toHtml(screen());
}

function advance() {
  if (!keys.paused) {
    tick += 1;
    if (reveal !== undefined) reveal = reveal >= T.W ? undefined : reveal + 4;
    else if (typed !== null) typed = typed > 120 ? null : typed + 2;
    else if (keys.replay && tick % 6 === 0) {
      if (step < EVENTS.length) {
        step += 1;
        typed = 0;
        freshAt = tick;
      } else keys.replay = false;
    }
  }
  draw();
  setTimeout(advance, keys.speed);
}

// The budget is how often Claude updates this page, so only the chat can change
// it: the panel explains each one and copies the words to type.
function budgetPanel(sel, note) {
  return {
    type: 'budget',
    sel: sel,
    action: 'copy "budget ' + sel + '"',
    note: note || 'To switch, type in the chat: budget ' + sel,
  };
}

function copyBudget() {
  var words = 'budget ' + panel.sel;
  var sel = panel.sel;
  var done = function (ok) {
    panel = budgetPanel(sel, ok ? 'Copied "' + words + '": paste it in the chat to switch.' : 'Copy is blocked here; type in the chat: ' + words);
    draw();
  };
  try {
    navigator.clipboard.writeText(words).then(function () { done(true); }, function () { done(false); });
  } catch (e) {
    done(false);
  }
}

function press(key) {
  var k = key.length === 1 ? key.toLowerCase() : key;
  if (panel) {
    var at = T.BUDGETS.indexOf(panel.sel);
    if (k === 'ArrowUp') panel = budgetPanel(T.BUDGETS[(at + 2) % 3]);
    else if (k === 'ArrowDown') panel = budgetPanel(T.BUDGETS[(at + 1) % 3]);
    else if (k === 'Enter') copyBudget();
    else if (k === 'b' || k === 'Escape') panel = null;
    else return false;
    draw();
    return true;
  }
  if (k === 'g') keys.graph = (keys.graph || base.graph) === 'off' ? 'on' : 'off';
  else if (k === 'f') reveal = 0;
  else if (k === 'l') keys.legend = !keys.legend;
  else if (k === 'b') panel = budgetPanel(base.budget || 'low');
  else if (k === ' ') keys.paused = !keys.paused;
  else if (k === 's') { tick += 1; if (keys.replay && step < EVENTS.length) { step += 1; typed = null; freshAt = tick; } }
  else if (k === 't') {
    keys.theme = T.THEMES[(T.THEMES.indexOf(keys.theme) + 1) % T.THEMES.length];
    document.documentElement.setAttribute('data-theme', keys.theme);
  } else if (k === '-') keys.speed = Math.min(2000, keys.speed * 2);
  else if (k === '+' || k === '=') keys.speed = keys.speed <= 60 ? 500 : Math.max(60, Math.floor(keys.speed / 2));
  else if (k === 'r') { keys.replay = true; step = 0; tick = 0; typed = null; keys.graph = null; freshAt = 0; }
  else return false;
  draw();
  return true;
}

document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (press(e.key)) e.preventDefault();
});
// The bottom row is the only key panel: each [X] on it is a button.
screenEl.addEventListener('click', function (e) {
  var hit = e.target && e.target.closest && e.target.closest('.a-h, .a-f');
  if (hit && hit.className === 'a-f') hit = hit.previousElementSibling;
  var key = hit && hit.className === 'a-h' && T.hotkey(hit.textContent);
  if (key) press(key);
});
document.documentElement.setAttribute('data-theme', keys.theme);
typed = 0;
draw();
setTimeout(advance, keys.speed);
</script>
</body>
</html>
