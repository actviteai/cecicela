<script>
// The model edits only STATE and EVENTS. Append one line per state change above the marker; never re-send this file.
var STATE = "title: \"ship the docs site\"\njobs:\n  - id: j1\n    goal: scaffold repo\n    owner: self\n    depends_on: []\n    schedule: once\n    status: done\n    done_test: the repository builds an empty site\n    artifact: repo/\n    gpu: null\n    cela_gate: COMPLETE\n  - id: j2\n    goal: content model\n    owner: self\n    depends_on: [j1]\n    schedule: once\n    status: done\n    done_test: every page type has a schema and an example\n    artifact: content-model.md\n    gpu: null\n    cela_gate: COMPLETE\n  - id: j3\n    goal: pick theme\n    owner: self\n    depends_on: [j1]\n    schedule: once\n    status: done\n    done_test: a human approved the theme\n    artifact: theme.md\n    gpu: null\n    cela_gate: null\n  - id: j6\n    goal: announce\n    owner: self\n    depends_on: [j1]\n    schedule: once\n    status: blocked\n    done_test: a human approved the post\n    artifact: announcement.md\n    gpu: null\n    cela_gate: null\n  - id: j4\n    goal: build pages\n    owner: self\n    depends_on: [j2]\n    schedule: once\n    status: done\n    done_test: every page renders from the content model\n    artifact: site/\n    gpu: null\n    cela_gate: COMPLETE\n  - id: j5\n    goal: deploy\n    owner: self\n    depends_on: [j3, j4]\n    schedule: once\n    status: running\n    done_test: the deploy URL serves the home page\n    artifact: deploy.log\n    gpu: null\n    cela_gate: null\n";
var EVENTS = [
  "j1 running cela:pending",
  "j1 done cela:ok",
  "j2 running cela:pending",
  "j3 running",
  "j2 done cela:ok",
  "j3 gate gate:human",
  "j4 running cela:pending",
  "j4 done cela:ok",
  "j3 done gate:approved",
  "j6 blocked",
  "j5 running cela:pending",
  // append new event lines above this one
];

var T = window.CeciTUI;
var screenEl = document.getElementById('screen');
var keys = { graph: null, legend: true, paused: false, theme: 'green', speed: 250 };
var base = T.fromStateMd(STATE);
base.events = EVENTS;
var step = EVENTS.length;
var tick = 0;
var typed = 0;
var reveal = base.graph === 'frames' ? 0 : undefined;

function rewound(model) {
  var touched = {};
  model.events.forEach(function (line) {
    var ev = T.parseEvent(line);
    if (ev && ev.type === 'job') touched[ev.job] = true;
  });
  var copy = JSON.parse(JSON.stringify(model));
  copy.events = model.events;
  copy.jobs.forEach(function (job) {
    if (!touched[job.id]) return;
    job.status = job.depends_on.length ? 'blocked' : 'ready';
    job.cela = null;
  });
  return copy;
}

function screen() {
  var model = step === EVENTS.length && !keys.replay ? base : rewound(base);
  var view = Object.assign({}, model, { legend: keys.legend });
  if (keys.graph) view.graph = keys.graph;
  var opts = { tick: tick, step: step };
  if (typed !== null) opts.typed = typed;
  if (reveal !== undefined) opts.reveal = reveal;
  return T.render(view, opts);
}

function draw() {
  screenEl.innerHTML = T.toHtml(screen());
}

function advance() {
  if (!keys.paused) {
    tick += 1;
    if (reveal !== undefined) reveal = reveal >= T.W ? undefined : reveal + 4;
    else if (typed !== null) typed = typed > 120 ? null : typed + 2;
    else if (keys.replay && step < EVENTS.length && tick % 6 === 0) {
      step += 1;
      typed = 0;
      if (step === EVENTS.length) keys.replay = false;
    }
  }
  draw();
  setTimeout(advance, keys.speed);
}

function press(key) {
  var k = key.toLowerCase();
  if (k === 'g') keys.graph = (keys.graph || base.graph) === 'off' ? 'on' : 'off';
  else if (k === 'f') reveal = 0;
  else if (k === 'l') keys.legend = !keys.legend;
  else if (k === ' ') keys.paused = !keys.paused;
  else if (k === 's') { tick += 1; if (keys.replay && step < EVENTS.length) { step += 1; typed = null; } }
  else if (k === 't') {
    keys.theme = keys.theme === 'green' ? 'amber' : 'green';
    document.documentElement.setAttribute('data-theme', keys.theme);
  } else if (k === '-') keys.speed = Math.min(2000, keys.speed * 2);
  else if (k === '+' || k === '=') keys.speed = Math.max(60, Math.floor(keys.speed / 2));
  else if (k === 'r') { keys.replay = true; step = 0; tick = 0; typed = null; keys.graph = null; }
  else return false;
  draw();
  return true;
}

document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (press(e.key)) e.preventDefault();
});
Array.prototype.forEach.call(document.querySelectorAll('button[data-key]'), function (b) {
  b.addEventListener('click', function () { press(b.getAttribute('data-key')); });
});
typed = 0;
draw();
setTimeout(advance, keys.speed);
</script>
</body>
</html>
